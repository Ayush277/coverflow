# Render blueprint — deploys the CoverFlow API as a persistent web service.
# Import at https://dashboard.render.com/select-repo (Render auto-detects this file).
#
# Note: the free tier has no persistent disk, so the SQLite database lives in the
# ephemeral filesystem and re-seeds its demo world automatically on every boot —
# which is exactly what you want for a demo. Upgrade to a paid plan and add a
# `disk:` mount at services/api/data if you need the data to persist.
services:
  - type: web
    name: coverflow-api
    runtime: node
    plan: free
    region: singapore
    rootDir: services/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false   # set to your Vercel URL, e.g. https://coverflow.vercel.app
      # Optional — real email delivery (otherwise an Ethereal preview inbox is used):
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
