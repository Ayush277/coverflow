server:
  port: 8080

spring:
  application:
    name: coverflow-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coverflow}
    username: ${POSTGRES_USER:coverflow}
    password: ${POSTGRES_PASSWORD:coverflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

coverflow:
  jwt-secret: ${JWT_SECRET:coverflow-dev-secret-change-in-prod}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{24} - %msg%n"
